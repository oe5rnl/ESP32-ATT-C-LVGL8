<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .box   { fill:#f5f7fa; stroke:#334155; stroke-width:2; rx:8; }
      .title { font-size:16px; font-weight:700; fill:#0f172a; }
      .sub   { font-size:11px; fill:#475569; }
      .pin   { font-size:11px; fill:#0f172a; }
      .pad   { fill:#1e293b; }
      .lbl   { font-size:11px; fill:#334155; }
      .note  { font-size:12px; fill:#64748b; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">
    Attenuator-Controller — Komponentenverbindung
  </text>

  <!-- ================= ESP32 CYD ================= -->
  <rect class="box" x="60" y="90" width="230" height="150" rx="8"/>
  <text class="title" x="175" y="118" text-anchor="middle">ESP32 CYD</text>
  <text class="sub"   x="175" y="136" text-anchor="middle">Touch ILI9341 320x240 / WiFi / LVGL8</text>
  <!-- right side pins -->
  <circle class="pad" cx="290" cy="170" r="4"/><text class="pin" x="282" y="167" text-anchor="end">GPIO1 TX</text>
  <circle class="pad" cx="290" cy="195" r="4"/><text class="pin" x="282" y="192" text-anchor="end">GPIO3 RX</text>
  <circle class="pad" cx="290" cy="220" r="4"/><text class="pin" x="282" y="217" text-anchor="end">GND</text>

  <!-- ================= Platine / Pico ================= -->
  <rect class="box" x="420" y="90" width="260" height="470" rx="8"/>
  <text class="title" x="550" y="118" text-anchor="middle">Platine ./Schaltung</text>
  <text class="sub"   x="550" y="136" text-anchor="middle">Raspberry Pi Pico + Relais</text>

  <!-- left side pins (UART to ESP32) -->
  <circle class="pad" cx="420" cy="170" r="4"/><text class="pin" x="430" y="167">GP1 RX (Pin2)</text>
  <circle class="pad" cx="420" cy="195" r="4"/><text class="pin" x="430" y="192">GP0 TX (Pin1)</text>
  <circle class="pad" cx="420" cy="220" r="4"/><text class="pin" x="430" y="217">GND (Pin3)</text>

  <!-- right side pins (I2C to OLED) -->
  <circle class="pad" cx="680" cy="180" r="4"/><text class="pin" x="670" y="177" text-anchor="end">GP4 SDA (Pin6)</text>
  <circle class="pad" cx="680" cy="205" r="4"/><text class="pin" x="670" y="202" text-anchor="end">GP5 SCL (Pin7)</text>
  <circle class="pad" cx="680" cy="230" r="4"/><text class="pin" x="670" y="227" text-anchor="end">3V3 (Pin36)</text>
  <circle class="pad" cx="680" cy="255" r="4"/><text class="pin" x="670" y="252" text-anchor="end">GND (Pin18)</text>

  <!-- right side pins (Encoder) -->
  <circle class="pad" cx="680" cy="330" r="4"/><text class="pin" x="670" y="327" text-anchor="end">GP19 CLK/A (Pin25)</text>
  <circle class="pad" cx="680" cy="355" r="4"/><text class="pin" x="670" y="352" text-anchor="end">GP20 DT/B (Pin26)</text>
  <circle class="pad" cx="680" cy="380" r="4"/><text class="pin" x="670" y="377" text-anchor="end">GP21 SW (Pin27)</text>
  <circle class="pad" cx="680" cy="405" r="4"/><text class="pin" x="670" y="402" text-anchor="end">GND</text>

  <!-- bottom pins (Relais + ADC) -->
  <circle class="pad" cx="490" cy="560" r="4"/><text class="pin" x="490" y="580" text-anchor="middle">GP2..GP18 Relais</text>
  <circle class="pad" cx="610" cy="560" r="4"/><text class="pin" x="610" y="580" text-anchor="middle">GP26 ADC0</text>

  <!-- ================= OLED ================= -->
  <rect class="box" x="770" y="150" width="180" height="130" rx="8"/>
  <text class="title" x="860" y="178" text-anchor="middle">SSD1306 OLED</text>
  <text class="sub"   x="860" y="196" text-anchor="middle">kleines Display (I2C)</text>
  <circle class="pad" cx="770" cy="180" r="4"/><text class="pin" x="780" y="177">SDA</text>
  <circle class="pad" cx="770" cy="205" r="4"/><text class="pin" x="780" y="202">SCL</text>
  <circle class="pad" cx="770" cy="230" r="4"/><text class="pin" x="780" y="227">VCC</text>
  <circle class="pad" cx="770" cy="255" r="4"/><text class="pin" x="780" y="252">GND</text>

  <!-- ================= Encoder ================= -->
  <rect class="box" x="770" y="300" width="180" height="135" rx="8"/>
  <text class="title" x="860" y="328" text-anchor="middle">Drehgeber</text>
  <text class="sub"   x="860" y="346" text-anchor="middle">Rotary Encoder</text>
  <circle class="pad" cx="770" cy="330" r="4"/><text class="pin" x="780" y="327">A (CLK)</text>
  <circle class="pad" cx="770" cy="355" r="4"/><text class="pin" x="780" y="352">B (DT)</text>
  <circle class="pad" cx="770" cy="380" r="4"/><text class="pin" x="780" y="377">SW</text>
  <circle class="pad" cx="770" cy="405" r="4"/><text class="pin" x="780" y="402">GND</text>

  <!-- ================= Relais/Attenuator block ================= -->
  <rect class="box" x="410" y="610" width="180" height="50" rx="8"/>
  <text class="title" x="500" y="632" text-anchor="middle" font-size="13">Relais + HF-Attenuator</text>
  <text class="sub"   x="500" y="649" text-anchor="middle">26.5GHz / 135dB / 141dB</text>

  <!-- ================= ADC divider ================= -->
  <rect class="box" x="620" y="610" width="150" height="50" rx="8"/>
  <text class="title" x="695" y="632" text-anchor="middle" font-size="13">R10 / R11</text>
  <text class="sub"   x="695" y="649" text-anchor="middle">Typ-Kodierung</text>

  <!-- ================= WIRES ================= -->
  <!-- UART ESP32 -> Pico (gelb TX->RX) -->
  <path d="M290,170 C355,170 355,170 420,170" fill="none" stroke="#eab308" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="lbl" x="355" y="160" text-anchor="middle" fill="#a16207">TX→RX (gelb)</text>
  <!-- UART Pico -> ESP32 (blau TX->RX) -->
  <path d="M420,195 C355,205 355,205 290,195" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="lbl" x="355" y="222" text-anchor="middle" fill="#1d4ed8">TX→RX (blau)</text>
  <!-- GND ESP32 - Pico (schwarz) -->
  <path d="M290,220 C340,245 370,245 420,220" fill="none" stroke="#111827" stroke-width="2.5"/>
  <text class="lbl" x="355" y="255" text-anchor="middle">GND (schwarz)</text>

  <!-- I2C Pico -> OLED -->
  <path d="M680,180 L770,180" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M680,205 L770,205" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M680,230 L770,230" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M680,255 L770,255" fill="none" stroke="#111827" stroke-width="2"/>
  <text class="lbl" x="725" y="145" text-anchor="middle" fill="#047857">I2C</text>

  <!-- Encoder -> Pico -->
  <path d="M770,330 L680,330" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M770,355 L680,355" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M770,380 L680,380" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M770,405 L680,405" fill="none" stroke="#111827" stroke-width="2"/>
  <text class="lbl" x="725" y="295" text-anchor="middle" fill="#7e22ce">Encoder</text>

  <!-- Relais + ADC bottom -->
  <path d="M490,560 L500,610" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M610,560 C650,585 690,590 695,610" fill="none" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text class="note" x="60" y="640">Legende:</text>
  <line x1="120" y1="636" x2="150" y2="636" stroke="#eab308" stroke-width="3"/><text class="note" x="155" y="640">UART TX→RX</text>
  <line x1="120" y1="655" x2="150" y2="655" stroke="#059669" stroke-width="3"/><text class="note" x="155" y="659">I2C</text>
  <line x1="250" y1="636" x2="280" y2="636" stroke="#9333ea" stroke-width="3"/><text class="note" x="285" y="640">Encoder</text>
  <line x1="250" y1="655" x2="280" y2="655" stroke="#111827" stroke-width="3"/><text class="note" x="285" y="659">GND</text>
</svg>
